<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>COCKPIT RACER v3-DEBUG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;width:100%;height:100%;overflow:hidden}
body{display:flex;justify-content:center;align-items:center;height:100dvh;font-family:monospace}
canvas{display:block;width:100%;height:100%}
#start-screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#000;z-index:10;color:#fff}
#start-screen h1{font-size:32px;color:#ff4400;margin-bottom:20px}
#startBtn{padding:12px 40px;font-size:18px;background:#ff4400;color:#fff;border:none;cursor:pointer;font-family:monospace}
#downloadBtn{margin-top:10px;padding:8px 20px;font-size:12px;background:#333;color:#fff;border:1px solid #555;cursor:pointer;font-family:monospace}
#hud{position:absolute;top:10px;left:10px;color:#fff;font-size:14px;z-index:5}
#speed-val{color:#ff4400;font-size:20px}
.touch-controls{display:none;position:absolute;bottom:0;left:0;width:100%;height:160px;z-index:6}
.touch-btn{position:absolute;width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:rgba(255,255,255,0.6);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#btn-left{left:10px;bottom:40px;background:rgba(255,68,0,0.3);border:2px solid rgba(255,68,0,0.5)}
#btn-right{left:90px;bottom:40px;background:rgba(255,68,0,0.3);border:2px solid rgba(255,68,0,0.5)}
#btn-gas{right:10px;bottom:50px;width:80px;height:80px;background:rgba(0,180,0,0.3);border:2px solid rgba(0,180,0,0.5)}
#btn-brake{right:100px;bottom:50px;background:rgba(180,0,0,0.3);border:2px solid rgba(180,0,0,0.5)}
@media(max-width:768px),(pointer:coarse){.touch-controls{display:block}}
</style>
</head>
<body>
<div id="start-screen">
<h1>COCKPIT RACER</h1>
<p id="version-text" style="color:#666;margin-bottom:20px;font-size:12px"></p>
<button id="startBtn">START</button>
<button id="downloadBtn">DOWNLOAD</button>
</div>
<canvas id="game" width="320" height="480"></canvas>
<div class="touch-controls">
<div class="touch-btn" id="btn-left">◀</div>
<div class="touch-btn" id="btn-right">▶</div>
<div class="touch-btn" id="btn-brake">🛑</div>
<div class="touch-btn" id="btn-gas">🏎️</div>
</div>
<div id="hud"><div id="version-display">V: </div><div id="speed-val">0 km/h</div><div id="dist-val">DIST: 0.0 km</div><div id="time-val">TIME: 0:00</div></div>
<script>
(function(){
'use strict';

// === DOM refs ===
var canvas=document.getElementById('game');
var ctx=canvas&&canvas.getContext('2d');
if(!ctx){
  var ss=document.getElementById('start-screen');
  if(ss){
    var err=document.createElement('p');
    err.style.color='#ff0000';err.style.fontSize='16px';err.style.padding='20px';
    err.textContent='CANVAS NOT SUPPORTED on this device';
    ss.appendChild(err);
  }
}
var W=window.innerWidth||320;
var H=window.innerHeight||480;
if(canvas){canvas.width=W;canvas.height=H;}

// === Constants ===
var SEG_LEN=200;
var ROAD_W=2000;
var DRAW_DIST=150;
var CAM_H=1000;
var CAM_D=0.84;

var VERSION='v4';
var segments=[];
var trackLength=0;
var player={x:0,z:0,speed:0,maxSpeed:SEG_LEN*60,accel:SEG_LEN*12,decel:SEG_LEN*8,brake:SEG_LEN*20,steer:0,lap:0,lapTime:0,totalTime:0,dist:0};
var keys={};
var gameRunning=false;
var lastTime=0;
var rafId=null;

// === Build track ===
function buildTrack(){
  segments=[];
  function addR(en,ho,lv,cv,hl){
    var t=en+ho+lv;
    for(var i=0;i<t;i++){
      var c=0,h=hl||0;
      if(i<en)c=cv*(i/en);
      else if(i<en+ho)c=cv;
      else c=cv*(1-(i-en-ho)/lv);
      var si=segments.length;
      segments.push({
        index:si,
        p:{world:{x:0,y:0,z:0},screen:{},scale:0,camera:{}},
        p2:{world:{x:0,y:0,z:0},screen:{},scale:0,camera:{}},
        curve:c,hill:h,color:Math.floor(si/3)%2?'dark':'light'
      });
    }
  }
  addR(10,50,10,0,0);addR(15,30,15,2,0);addR(10,20,10,0,5);
  addR(15,40,15,-3,0);addR(10,30,10,0,-3);addR(20,60,20,1.5,2);
  addR(10,20,10,-2,0);addR(15,40,15,0,-5);addR(10,30,10,3,3);
  addR(15,50,15,-1.5,0);addR(10,20,10,0,4);addR(20,60,20,-2.5,-2);
  addR(10,40,10,0,0);addR(15,30,15,2,3);addR(10,20,10,-3,0);
  addR(10,30,10,0,-4);addR(20,50,20,1,0);addR(15,40,15,-2,2);
  addR(10,30,10,0,0);
  while(segments.length<1600){
    var r=Math.random();
    if(r<0.3)addR(10,30+Math.random()*40,10,(Math.random()-0.5)*6,(Math.random()-0.5)*8);
    else addR(10,20+Math.random()*30,10,0,(Math.random()-0.5)*6);
  }
  var cy=0,cx=0;
  for(var i=0;i<segments.length;i++){
    segments[i].p.world.z=i*SEG_LEN;
    segments[i].p.world.y=cy;
    segments[i].p.world.x=cx;
    cy+=segments[i].hill;
    cx+=segments[i].curve*0.3;
  }
  for(var i=0;i<segments.length-1;i++){
    segments[i].p2.world.x=segments[i+1].p.world.x;
    segments[i].p2.world.y=segments[i+1].p.world.y;
    segments[i].p2.world.z=segments[i+1].p.world.z;
  }
  var la=segments[segments.length-1];
  la.p2.world.x=la.p.world.x;la.p2.world.y=la.p.world.y;la.p2.world.z=la.p.world.z+SEG_LEN;
  trackLength=segments.length*SEG_LEN;
}

// === Find segment ===
function findSeg(z){
  if(!segments||segments.length===0)return null;
  var idx=Math.floor(z/SEG_LEN)%segments.length;
  if(idx<0)idx+=segments.length;
  return segments[idx];
}

// === Project ===
function proj(p,cx,cy,cz,cd,w,h,rw){
  if(!p)return;
  if(!p.world||typeof p.world.y!=='number'||typeof p.world.z!=='number')return;
  try{
  p.camera=p.camera||{};
  p.camera.x=p.world.x-cx;
  p.camera.y=p.world.y-cy;
  p.camera.z=p.world.z-cz;
  if(p.camera.z<=0.1)p.camera.z=0.1;
  p.screen=p.screen||{};
  p.screen.scale=cd/p.camera.z*w/2;
  p.screen.x=Math.round(w/2+p.screen.scale*p.camera.x);
  p.screen.y=Math.round(h/2-p.screen.scale*p.camera.y);
  p.screen.w=Math.round(p.screen.scale*rw);
  }catch(e){
    throw new Error('proj FAIL: p.world.y='+p.world.y+' p.world.z='+p.world.z+' cx='+cx+' cy='+cy+' cz='+cz);
  }
}

// === Draw trapezoid ===
function drawTrap(x1,y1,w1,x2,y2,w2){
  ctx.beginPath();
  ctx.moveTo(x1-w1,y1);ctx.lineTo(x1+w1,y1);
  ctx.lineTo(x2+w2,y2);ctx.lineTo(x2-w2,y2);
  ctx.closePath();ctx.fill();
}

// === Update ===
function update(dt){
  if(!gameRunning)return;
  var ps=findSeg(player.z);
  if(!ps)return;
  var sp=player.speed/player.maxSpeed;
  var dx=dt*2*sp;
  if(keys.ArrowLeft)player.steer=Math.max(player.steer-dt*5,-1);
  else if(keys.ArrowRight)player.steer=Math.min(player.steer+dt*5,1);
  else player.steer*=0.9;
  player.x-=dx*ps.curve*sp*0.8;
  player.x+=player.steer*dx*2.5;
  if(keys.ArrowUp){
    var af=Math.sin(sp*Math.PI*0.8)*0.8+0.2;
    player.speed+=player.accel*af*dt;
  }else if(keys.ArrowDown||keys.Space){
    player.speed-=keys.Space?player.brake*1.5*dt:player.brake*dt;
  }else{
    player.speed-=player.decel*0.3*dt;
  }
  if(Math.abs(player.x)>ROAD_W*0.8){
    player.speed-=player.brake*dt;
    if(player.x>ROAD_W)player.x-=dt*200;
    if(player.x<-ROAD_W)player.x+=dt*200;
  }
  player.speed=Math.max(0,Math.min(player.speed,player.maxSpeed));
  player.x=Math.max(-ROAD_W*1.5,Math.min(ROAD_W*1.5,player.x));
  player.z+=player.speed*dt;
  if(player.z>=trackLength){player.z-=trackLength;player.lap++;player.lapTime=0;}
  player.lapTime+=dt;player.totalTime+=dt;
  player.dist+=player.speed*dt/100000;
}

// === Render ===
function render(){
  if(!ctx)return;
  try{
  ctx.clearRect(0,0,W,H);
  
  try{
  // Sky - simple fill
  ctx.fillStyle='#000022';
  ctx.fillRect(0,0,W,H*0.5);
  }catch(e){throw new Error('SKY:'+e.message);}
  
  try{
  // Stars
  ctx.fillStyle='#fff';
  for(var i=0;i<30;i++){
    ctx.fillRect((i*137.5+player.z*0.001)%W,(i*97.3)%(H*0.35),1.5,1.5);
  }
  }catch(e){throw new Error('STARS:'+e.message);}
  
  try{
  // Mountains
  ctx.fillStyle='#0a1a3a';ctx.beginPath();ctx.moveTo(0,H*0.45);
  for(var i=0;i<=W;i+=3){
    var mh=Math.sin(i*0.003+player.z*0.00005)*40+Math.sin(i*0.007+1)*25;
    ctx.lineTo(i,H*0.42-mh);
  }
  ctx.lineTo(W,H*0.5);ctx.lineTo(0,H*0.5);ctx.fill();
  }catch(e){throw new Error('MTN:'+e.message);}
  
  try{
  // Base segment
  var bs=findSeg(player.z);
  if(!bs||!bs.p||!bs.p.world||!bs.p2||!bs.p2.world){
    ctx.fillStyle='#111';ctx.fillRect(0,H*0.5,W,H*0.5);
    drawDash();return;
  }
  
  var bi=Math.floor(player.z/SEG_LEN)%segments.length;
  var bp=(player.z%SEG_LEN)/SEG_LEN;
  var pY=bs.p.world.y+(bs.p2.world.y-bs.p.world.y)*bp;
  var maxY=H,x=0,ddx=-(bs.curve*bp);
  var projected=[];
  
  for(var n=0;n<DRAW_DIST;n++){
    var si=(bi+n)%segments.length;
    var seg=segments[si];
    if(!seg)continue;
    if(!seg.p||!seg.p.world)continue;
    if(typeof seg.p.world.y!=='number')continue;
    if(!seg.p2||!seg.p2.world)continue;
    if(typeof seg.p2.world.y!=='number')continue;
    var looped=(bi+n)>=segments.length;
    var cz=player.z-(looped?trackLength:0);
    proj(seg.p,player.x*ROAD_W/2-x,pY+CAM_H,cz,CAM_D,W,H,ROAD_W);
    proj(seg.p2,player.x*ROAD_W/2-x-ddx,pY+CAM_H,cz,CAM_D,W,H,ROAD_W);
    x+=ddx;ddx+=seg.curve;
    if(!seg.p.camera||!seg.p2.screen)continue;
    if(typeof seg.p.camera.z!=='number'||seg.p2.screen.y>=maxY)continue;
    projected.push(seg);
    maxY=seg.p2.screen.y;
  }
  
  for(var i=projected.length-1;i>=0;i--){
    var s=projected[i];
    var p1=s.p.screen,p2=s.p2.screen;
    if(typeof p1.y!=='number'&&typeof p1.screen.y!=='number')continue;
    if(typeof p2.y!=='number'&&typeof p2.screen.y!=='number')continue;
    var dk=s.color==='dark';
    ctx.fillStyle=dk?'#0a3a0a':'#0b4a0b';
    ctx.fillRect(0,p2.screen.y,W,p1.screen.y-p2.screen.y);
    ctx.fillStyle=dk?'#cc0000':'#fff';
    drawTrap(p1.screen.x,p1.screen.y,p1.screen.w*1.15,p2.screen.x,p2.screen.y,p2.screen.w*1.15);
    ctx.fillStyle=dk?'#333':'#3a3a3a';
    drawTrap(p1.screen.x,p1.screen.y,p1.screen.w,p2.screen.x,p2.screen.y,p2.screen.w);
    if(!dk){ctx.fillStyle='#fff';drawTrap(p1.screen.x,p1.screen.y,p1.screen.w*0.01,p2.screen.x,p2.screen.y,p2.screen.w*0.01);}
  }
  }catch(e){throw new Error('ROAD:'+e.message);}
  
  try{drawDash();}catch(e){throw new Error('DASH:'+e.message);}
  }catch(e){alert(e.message);}
}

// === Dashboard ===
function drawDash(){
  if(!ctx||W<=0||H<=0)return;
  var mob=W<768;
  var dY=mob?H*0.75:H*0.8;
  var dH=H-dY;
  ctx.fillStyle='#1a1a1a';ctx.fillRect(0,dY,W,dH);
  var sw=mob?W*0.5:W*0.35;
  var sh=dH*0.6;
  var scx=W/2,scy=dY+dH*0.4;
  ctx.strokeStyle='#333';ctx.lineWidth=mob?8:12;
  ctx.beginPath();ctx.ellipse(scx,scy,sw,sh,0,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='#2a2a2a';ctx.lineWidth=mob?6:8;
  for(var i=0;i<3;i++){
    var a=(i/3)*Math.PI*2+Math.PI/2;
    ctx.beginPath();ctx.moveTo(scx,scy);
    ctx.lineTo(scx+Math.cos(a)*sw*0.8,scy+Math.sin(a)*sh*0.8);ctx.stroke();
  }
  var spx=mob?W*0.75:W*0.85;
  var spy=dY+dH*0.5;
  var spr=mob?Math.min(W,H)*0.1:Math.min(W,H)*0.12;
  ctx.fillStyle='#0a0a0a';ctx.beginPath();ctx.arc(spx,spy,spr,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#333';ctx.lineWidth=3;ctx.stroke();
  var kmh=Math.round(player.speed/player.maxSpeed*280);
  var na=-Math.PI*0.75+(kmh/280)*Math.PI*1.5;
  ctx.strokeStyle='#ff4400';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(spx,spy);
  ctx.lineTo(spx+Math.cos(na)*spr*0.7,spy+Math.sin(na)*spr*0.7);ctx.stroke();
  ctx.fillStyle='#ff4400';ctx.font='bold'+(mob?20:24)+'px monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(kmh,spx,spy);
  ctx.fillStyle='#666';ctx.font=(mob?10:12)+'px monospace';ctx.fillText('km/h',spx,spy+spr*0.4);
  var sv=document.getElementById('speed-val');
  var dv=document.getElementById('dist-val');
  var tv=document.getElementById('time-val');
  var vd=document.getElementById('version-display');
  if(sv)sv.textContent=kmh+' km/h';
  if(dv)dv.textContent='DIST: '+player.dist.toFixed(1)+' km';
  if(tv){var m=Math.floor(player.totalTime/60);var s=Math.floor(player.totalTime%60);tv.textContent='TIME: '+m+':'+(s<10?'0':'')+s;}
  if(vd)vd.textContent='V:'+VERSION;
}

// === Reset ===
function resetGame(){
  buildTrack();
  player.x=0;player.z=0;player.speed=0;player.steer=0;
  player.lap=0;player.lapTime=0;player.totalTime=0;player.dist=0;
}

// === Game loop ===
function gameLoop(ts){
  if(!lastTime)lastTime=ts;
  var dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;
  if(gameRunning){
    if(!segments||segments.length===0)buildTrack();
    update(dt);
    render();
  }
  if(typeof requestAnimationFrame==='function')rafId=requestAnimationFrame(gameLoop);
}

// === Start ===
function startGame(){
  if(!segments||segments.length===0)buildTrack();
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  W=canvas.width;H=canvas.height;
  document.getElementById('start-screen').style.display='none';
  resetGame();
  gameRunning=true;lastTime=0;
  requestAnimationFrame(gameLoop);
}

document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('startBtn').addEventListener('touchend',function(e){e.preventDefault();startGame();});

// === Touch controls ===
function addTouch(id,key){
  var el=document.getElementById(id);
  if(!el)return;
  el.addEventListener('touchstart',function(e){e.preventDefault();keys[key]=true;},{passive:false});
  el.addEventListener('touchend',function(e){e.preventDefault();keys[key]=false;},{passive:false});
  el.addEventListener('touchcancel',function(){keys[key]=false;});
  el.addEventListener('mousedown',function(){keys[key]=true;});
  el.addEventListener('mouseup',function(){keys[key]=false;});
  el.addEventListener('mouseleave',function(){keys[key]=false;});
}
addTouch('btn-left','ArrowLeft');
addTouch('btn-right','ArrowRight');
addTouch('btn-gas','ArrowUp');
addTouch('btn-brake','ArrowDown');

// === Keyboard ===
document.addEventListener('keydown',function(e){keys[e.code]=true;if(e.code==='KeyR')resetGame();e.preventDefault();});
document.addEventListener('keyup',function(e){keys[e.code]=false;e.preventDefault();});

// === Download ===
document.getElementById('downloadBtn').addEventListener('click',function(){
  var a=document.createElement('a');a.href='index.html';a.download='cockpit-racer.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
});

// === Error handler ===
window.addEventListener('error',function(e){
  alert('Global error: '+(e.error?e.error.message:'unknown'));
});

// === Init ===
buildTrack();
var vt=document.getElementById('version-text');
if(vt)vt.textContent='VERSION: '+VERSION;
var vd=document.getElementById('version-display');
if(vd)vd.textContent='V:'+VERSION;
})();
</script>
</body>
</html>
