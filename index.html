<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COCKPIT RACER</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; overflow: hidden; width: 100%; height: 100%; }
  body { display: flex; justify-content: center; align-items: center; height: 100dvh; font-family: 'Courier New', monospace; }
  canvas { display: block; image-rendering: pixelated; width: 100vw; height: 100dvh; }
  #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; z-index: 10; color: #fff; }
  #start-screen h1 { font-size: 48px; color: #ff4400; text-shadow: 0 0 20px #ff4400, 0 0 40px #ff2200; margin-bottom: 20px; letter-spacing: 8px; }
  #start-screen .subtitle { font-size: 14px; color: #888; margin-bottom: 40px; }
  #start-screen .controls { font-size: 13px; color: #666; line-height: 2; text-align: center; }
  #start-screen .controls span { color: #ff6600; }
  #start-screen .start-btn { margin-top: 30px; padding: 12px 40px; font-size: 18px; background: #ff4400; color: #fff; border: none; cursor: pointer; font-family: 'Courier New', monospace; letter-spacing: 4px; transition: all 0.3s; }
  #start-screen .start-btn:hover { background: #ff6600; box-shadow: 0 0 20px #ff4400; }
  #hud { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 14px; z-index: 5; }
  #hud div { margin-bottom: 4px; text-shadow: 1px 1px 2px #000; }
  #speed-val { color: #ff4400; font-size: 20px; }
  /* Touch controls */
  .touch-controls { display: none; position: absolute; bottom: 0; left: 0; width: 100%; height: 200px; z-index: 6; pointer-events: none; }
  .touch-controls.hidden { display: none !important; }
  .touch-btn { position: absolute; pointer-events: all; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: rgba(255,255,255,0.5); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .touch-btn:active { background: rgba(255,255,255,0.15) !important; }
  #btn-left { left: 10px; bottom: 60px; width: 80px; height: 80px; background: rgba(255,68,0,0.2); border: 2px solid rgba(255,68,0,0.4); }
  #btn-right { left: 100px; bottom: 60px; width: 80px; height: 80px; background: rgba(255,68,0,0.2); border: 2px solid rgba(255,68,0,0.4); }
  #btn-gas { right: 10px; bottom: 80px; width: 90px; height: 90px; background: rgba(0,180,0,0.2); border: 2px solid rgba(0,180,0,0.4); }
  #btn-brake { right: 110px; bottom: 80px; width: 80px; height: 80px; background: rgba(180,0,0,0.2); border: 2px solid rgba(180,0,0,0.4); }
  #start-screen .start-btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  @media (max-width: 768px), (pointer: coarse) {
    .touch-controls { display: block; }
    #start-screen .controls { display: none; }
  }
</style>
</head>
<body>

<div id="start-screen">
  <h1>COCKPIT RACER</h1>
  <div class="subtitle">COCKPIT VIEW RACING SIMULATOR</div>
  <div class="controls">
    <span>↑</span> ACCELERATE &nbsp; <span>↓</span> BRAKE<br>
    <span>← →</span> STEER &nbsp; <span>SPACE</span> HANDBRAKE<br>
    <span>R</span> RESTART
  </div>
  <button class="start-btn" id="startBtn">START ENGINE</button>
  <button class="start-btn" id="downloadBtn" style="margin-top:12px;background:#333;font-size:14px;padding:8px 24px;">DOWNLOAD (スマホ用)</button>
</div>

<canvas id="game"></canvas>

<!-- Touch controls for mobile -->
<div class="touch-controls">
  <div class="touch-btn" id="btn-left">◀</div>
  <div class="touch-btn" id="btn-right">▶</div>
  <div class="touch-btn" id="btn-brake">🛑</div>
  <div class="touch-btn" id="btn-gas">🏎️</div>
</div>

<div id="hud">
  <div id="speed-val">0 km/h</div>
  <div id="dist-val">DIST: 0.0 km</div>
  <div id="time-val">TIME: 0:00</div>
</div>

<script>
// ============================================================
// COCKPIT RACER — First-person pseudo-3D racing game
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const speedVal = document.getElementById('speed-val');
const distVal = document.getElementById('dist-val');
const timeVal = document.getElementById('time-val');

// --- Canvas sizing ---
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Constants ---
const SEGMENT_LENGTH = 200;
const ROAD_WIDTH = 2000;
const LANES = 3;
const DRAW_DISTANCE = 300;
const CAMERA_HEIGHT = 1000;
const CAMERA_DEPTH = 1 / Math.tan((80 / 2) * Math.PI / 180);
const TOTAL_SEGMENTS = 6000;
const TRACK_LENGTH = TOTAL_SEGMENTS * SEGMENT_LENGTH;

// --- Colors ---
const COLORS = {
  SKY_TOP: '#000820',
  SKY_BOTTOM: '#1a2a5a',
  GROUND1: '#1a5c1a',
  GROUND2: '#165216',
  ROAD1: '#6B6B6B',
  ROAD2: '#636363',
  RUMBLE1: '#CC0000',
  RUMBLE2: '#FFFFFF',
  LANE: '#CCCCCC',
  START_LINE: '#FFFFFF',
};

// --- Road segments ---
let segments = [];
let trackLength = 0;

function buildTrack() {
  segments = [];

  function addSegments(count, curve, hill) {
    for (let i = 0; i < count; i++) {
      segments.push({
        index: segments.length,
        p: { world: { x: 0, y: 0, z: 0 }, screen: {}, scale: 0 },
        p2: { world: { x: 0, y: 0, z: 0 }, screen: {}, scale: 0 },
        curve: curve,
        hill: hill,
        sprites: [],
        cars: [],
        color: Math.floor(segments.length / 3) % 2 ? 'dark' : 'light',
      });
    }
  }

  function addRoad(enter, hold, leave, curve, hill) {
    const total = enter + hold + leave;
    for (let i = 0; i < total; i++) {
      let c = 0, h = hill || 0;
      if (i < enter) {
        c = curve * (i / enter);
        h = 0;
      } else if (i < enter + hold) {
        c = curve;
        h = 0;
      } else {
        c = curve * (1 - (i - enter - hold) / leave);
        h = 0;
      }
      addSegments(1, c, h);
    }
  }

  // Build varied track
  addRoad(10, 50, 10, 0, 0);       // straight start
  addRoad(15, 30, 15, 2, 0);        // gentle right
  addRoad(10, 20, 10, 0, 5);        // hill
  addRoad(15, 40, 15, -3, 0);       // left curve
  addRoad(10, 30, 10, 0, -3);       // downhill
  addRoad(20, 60, 20, 1.5, 2);      // gentle right + hill
  addRoad(10, 20, 10, -2, 0);       // left
  addRoad(15, 40, 15, 0, -5);       // steep downhill
  addRoad(10, 30, 10, 3, 3);        // sharp right + hill
  addRoad(15, 50, 15, -1.5, 0);     // gentle left
  addRoad(10, 20, 10, 0, 4);        // uphill
  addRoad(20, 60, 20, -2.5, -2);    // left + downhill
  addRoad(10, 40, 10, 0, 0);        // straight
  addRoad(15, 30, 15, 2, 3);        // right + hill
  addRoad(10, 20, 10, -3, 0);       // sharp left
  addRoad(10, 30, 10, 0, -4);       // downhill
  addRoad(20, 50, 20, 1, 0);        // straight
  addRoad(15, 40, 15, -2, 2);       // left + hill
  addRoad(10, 30, 10, 0, 0);        // straight

  // Fill remaining with varied segments
  while (segments.length < TOTAL_SEGMENTS) {
    const r = Math.random();
    if (r < 0.3) addRoad(10, 30 + Math.random()*40, 10, (Math.random()-0.5)*6, (Math.random()-0.5)*8);
    else addRoad(10, 20 + Math.random()*30, 10, 0, (Math.random()-0.5)*6);
  }

  // Calculate world coordinates
  let currentY = 0;
  let currentX = 0;
  for (let i = 0; i < segments.length; i++) {
    segments[i].p.world.z = i * SEGMENT_LENGTH;
    segments[i].p.world.y = currentY;
    segments[i].p.world.x = currentX;
    currentY += segments[i].hill;
    currentX += segments[i].curve * 0.3;
  }

  // Set p2 (end point of segment)
  for (let i = 0; i < segments.length - 1; i++) {
    segments[i].p2.world.x = segments[i+1].p.world.x;
    segments[i].p2.world.y = segments[i+1].p.world.y;
    segments[i].p2.world.z = segments[i+1].p.world.z;
  }
  const last = segments[segments.length - 1];
  last.p2.world.x = last.p.world.x;
  last.p2.world.y = last.p.world.y;
  last.p2.world.z = last.p.world.z + SEGMENT_LENGTH;

  trackLength = segments.length * SEGMENT_LENGTH;
}

// --- Sprites (roadside objects) ---
function addSprites() {
  for (let i = 0; i < segments.length; i++) {
    // Trees on both sides
    if (Math.random() < 0.15) {
      const side = Math.random() < 0.5 ? -1 : 1;
      const offset = 1.2 + Math.random() * 3;
      segments[i].sprites.push({ type: 'tree', offset: side * offset });
    }
    // Rocks
    if (Math.random() < 0.05) {
      const side = Math.random() < 0.5 ? -1 : 1;
      segments[i].sprites.push({ type: 'rock', offset: side * (1.1 + Math.random()) });
    }
  }
}

// --- Traffic cars ---
let trafficCars = [];
function initTraffic() {
  trafficCars = [];
  const count = 80;
  for (let i = 0; i < count; i++) {
    trafficCars.push({
      z: Math.random() * trackLength,
      speed: 2000 + Math.random() * 4000,
      offset: (Math.random() - 0.5) * 1.2,
      color: ['#cc0000', '#0044cc', '#ffcc00', '#00cc44', '#cc6600', '#9933cc'][Math.floor(Math.random()*6)],
      sprite: 'car',
    });
  }
}

// --- Player ---
let player = {
  x: 0,
  z: 0,
  speed: 0,
  maxSpeed: SEGMENT_LENGTH * 60, // ~12000 units/s
  accel: SEGMENT_LENGTH * 12,
  decel: SEGMENT_LENGTH * 8,
  brake: SEGMENT_LENGTH * 20,
  offRoadDecel: SEGMENT_LENGTH * 15,
  offRoadMaxSpeed: SEGMENT_LENGTH * 8,
  steerAngle: 0,
  rpm: 0,
  gear: 1,
  lapTime: 0,
  totalTime: 0,
  distance: 0,
  lap: 0,
  bestLap: Infinity,
};

// --- Input ---
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR') resetGame();
  e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; e.preventDefault(); });

// --- Touch controls ---
function addTouch(id, code) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('touchstart', e => { e.preventDefault(); keys[code] = true; }, { passive: false });
  el.addEventListener('touchend', e => { e.preventDefault(); keys[code] = false; }, { passive: false });
  el.addEventListener('touchcancel', e => { keys[code] = false; });
  // Mouse fallback for testing on desktop
  el.addEventListener('mousedown', e => { e.preventDefault(); keys[code] = true; });
  el.addEventListener('mouseup', e => { keys[code] = false; });
  el.addEventListener('mouseleave', e => { keys[code] = false; });
}
addTouch('btn-left', 'ArrowLeft');
addTouch('btn-right', 'ArrowRight');
addTouch('btn-gas', 'ArrowUp');
addTouch('btn-brake', 'ArrowDown');

// --- Audio Engine ---
let audioCtx = null;
let engineOsc = null;
let engineGain = null;
let engineFilter = null;
let windNoise = null;
let windGain = null;

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Engine tone
  engineOsc = audioCtx.createOscillator();
  engineGain = audioCtx.createGain();
  engineFilter = audioCtx.createBiquadFilter();

  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 80;
  engineFilter.type = 'lowpass';
  engineFilter.frequency.value = 400;
  engineFilter.Q.value = 2;
  engineGain.gain.value = 0;

  engineOsc.connect(engineFilter);
  engineFilter.connect(engineGain);
  engineGain.connect(audioCtx.destination);
  engineOsc.start();

  // Wind noise
  const bufferSize = audioCtx.sampleRate * 2;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const output = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    output[i] = Math.random() * 2 - 1;
  }
  windNoise = audioCtx.createBufferSource();
  windNoise.buffer = noiseBuffer;
  windNoise.loop = true;
  windGain = audioCtx.createGain();
  const windFilter = audioCtx.createBiquadFilter();
  windFilter.type = 'bandpass';
  windFilter.frequency.value = 800;
  windFilter.Q.value = 0.5;
  windGain.gain.value = 0;
  windNoise.connect(windFilter);
  windFilter.connect(windGain);
  windGain.connect(audioCtx.destination);
  windNoise.start();
}

function updateAudio() {
  if (!audioCtx || !gameRunning) return;
  const speedRatio = player.speed / player.maxSpeed;
  const rpmRatio = player.rpm / 8500;

  // Engine pitch based on RPM
  const targetFreq = 60 + rpmRatio * 200;
  engineOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.05);
  engineFilter.frequency.setTargetAtTime(300 + rpmRatio * 1500, audioCtx.currentTime, 0.05);
  engineGain.gain.setTargetAtTime(0.04 + rpmRatio * 0.06, audioCtx.currentTime, 0.05);

  // Wind noise based on speed
  windGain.gain.setTargetAtTime(speedRatio * 0.03, audioCtx.currentTime, 0.1);
}

// --- Game state ---
let gameRunning = false;
let lastTime = 0;

// --- Projection ---
function project(p, cameraX, cameraY, cameraZ, cameraDepth, width, height, roadWidth) {
  p.camera = {};
  p.camera.x = p.world.x - cameraX;
  p.camera.y = p.world.y - cameraY;
  p.camera.z = p.world.z - cameraZ;
  p.screen.scale = cameraDepth / p.camera.z * width / 2;
  p.screen.x = Math.round(width / 2 + p.screen.scale * p.camera.x);
  p.screen.y = Math.round(height / 2 - p.screen.scale * p.camera.y);
  p.screen.w = Math.round(p.screen.scale * roadWidth);
}

// --- Find segment ---
function findSegment(z) {
  return segments[Math.floor(z / SEGMENT_LENGTH) % segments.length];
}

// --- Acceleration curve ---
function getAcceleration(speed, maxSpeed) {
  const ratio = speed / maxSpeed;
  // RPM-like curve: peaks around 60-70% speed, drops at high speed
  return Math.sin(ratio * Math.PI * 0.8) * 0.8 + 0.2;
}

// --- Update ---
function update(dt) {
  if (!gameRunning) return;

  const playerSegment = findSegment(player.z);
  const speedPercent = player.speed / player.maxSpeed;
  const dx = dt * 2 * speedPercent;

  // Steering
  if (keys['ArrowLeft']) {
    player.steerAngle = Math.max(player.steerAngle - dt * 5, -1);
  } else if (keys['ArrowRight']) {
    player.steerAngle = Math.min(player.steerAngle + dt * 5, 1);
  } else {
    player.steerAngle *= 0.9;
  }

  // Centrifugal force
  player.x -= dx * playerSegment.curve * speedPercent * 0.8;

  // Apply steering
  player.x += player.steerAngle * dx * 2.5;

  // Acceleration / braking
  if (keys['ArrowUp']) {
    const accelFactor = getAcceleration(player.speed, player.maxSpeed);
    player.speed += player.accel * accelFactor * dt;
  } else if (keys['ArrowDown'] || keys['Space']) {
    player.speed -= keys['Space'] ? player.brake * 1.5 * dt : player.brake * dt;
  } else {
    player.speed -= player.decel * 0.3 * dt;
  }

  // Off-road slowdown
  if (Math.abs(player.x) > ROAD_WIDTH * 0.8) {
    player.speed -= player.offRoadDecel * dt;
    // Bounce back
    if (player.x > ROAD_WIDTH) player.x -= dt * 200;
    if (player.x < -ROAD_WIDTH) player.x += dt * 200;
  }

  // Clamp
  player.speed = Math.max(0, Math.min(player.speed, player.maxSpeed));
  player.x = Math.max(-ROAD_WIDTH * 1.5, Math.min(ROAD_WIDTH * 1.5, player.x));

  // Move forward
  player.z += player.speed * dt;
  if (player.z >= trackLength) {
    player.z -= trackLength;
    player.lap++;
    if (player.lapTime < player.bestLap) player.bestLap = player.lapTime;
    player.lapTime = 0;
    player.lapFlash = 2.0; // flash for 2 seconds
  }
  if (player.lapFlash > 0) player.lapFlash -= dt;

  player.lapTime += dt;
  player.totalTime += dt;
  player.distance = player.z / 1000;

  // RPM and gear
  const rpmBase = speedPercent * 8000;
  const rpmNoise = Math.sin(player.totalTime * 30) * 200;
  player.rpm = Math.max(800, Math.min(8500, rpmBase + rpmNoise));

  // Gear
  if (player.speed < player.maxSpeed * 0.12) player.gear = 1;
  else if (player.speed < player.maxSpeed * 0.25) player.gear = 2;
  else if (player.speed < player.maxSpeed * 0.38) player.gear = 3;
  else if (player.speed < player.maxSpeed * 0.52) player.gear = 4;
  else if (player.speed < player.maxSpeed * 0.68) player.gear = 5;
  else player.gear = 6;

  // Gear change flash
  if (player._prevGear !== player.gear && player._prevGear !== undefined) {
    player.gearFlash = 0.3;
  }
  player._prevGear = player.gear;
  if (player.gearFlash > 0) player.gearFlash -= dt;

  // Update traffic
  for (const car of trafficCars) {
    car.z += car.speed * dt;
    if (car.z >= trackLength) car.z -= trackLength;

    // Collision check
    const carSeg = Math.floor(car.z / SEGMENT_LENGTH) % segments.length;
    const playerSeg = Math.floor(player.z / SEGMENT_LENGTH) % segments.length;
    if (Math.abs(carSeg - playerSeg) < 3) {
      const carWorldX = car.offset * ROAD_WIDTH * 0.5;
      const dx2 = player.x - carWorldX;
      if (Math.abs(dx2) < ROAD_WIDTH * 0.25 && player.speed > car.speed) {
        player.speed *= 0.6;
        player.z = car.z - SEGMENT_LENGTH * 2;
        player._collisionFlash = 0.5;
      }
    }
  }

  // HUD
  const kmh = Math.round(player.speed / player.maxSpeed * 280);
  speedVal.textContent = `${kmh} km/h`;
  speedVal.style.color = kmh > 240 ? '#ff0000' : '#ff4400';
  distVal.textContent = `DIST: ${player.distance.toFixed(1)} km`;
  const mins = Math.floor(player.totalTime / 60);
  const secs = Math.floor(player.totalTime % 60);
  timeVal.textContent = `TIME: ${mins}:${secs.toString().padStart(2, '0')}`;
}

// --- Render ---
function render() {
  ctx.clearRect(0, 0, W, H);

  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  skyGrad.addColorStop(0, COLORS.SKY_TOP);
  skyGrad.addColorStop(1, COLORS.SKY_BOTTOM);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H * 0.5);

  // Stars
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 50; i++) {
    const sx = (i * 137.5 + player.z * 0.001) % W;
    const sy = (i * 97.3) % (H * 0.35);
    const ss = (Math.sin(player.totalTime * 2 + i) + 1) * 1.5;
    ctx.fillRect(sx, sy, ss, ss);
  }

  // Mountains (parallax)
  drawMountains();

  const baseSegment = findSegment(player.z);
  const baseIndex = Math.floor(player.z / SEGMENT_LENGTH) % segments.length;
  const basePercent = (player.z % SEGMENT_LENGTH) / SEGMENT_LENGTH;
  const playerY = baseSegment.p.world.y + (baseSegment.p2.world.y - baseSegment.p.world.y) * basePercent;

  let maxY = H;
  let x = 0;
  let dx = -(baseSegment.curve * basePercent);

  // Project and store segments
  const projected = [];
  for (let n = 0; n < DRAW_DISTANCE; n++) {
    const i = (baseIndex + n) % segments.length;
    const seg = segments[i];
    const looped = (baseIndex + n) >= segments.length;
    const camZ = player.z - (looped ? trackLength : 0);

    project(seg.p,
      player.x * ROAD_WIDTH / 2 - x,
      playerY + CAMERA_HEIGHT,
      camZ,
      CAMERA_DEPTH, W, H, ROAD_WIDTH);
    project(seg.p2,
      player.x * ROAD_WIDTH / 2 - x - dx,
      playerY + CAMERA_HEIGHT,
      camZ,
      CAMERA_DEPTH, W, H, ROAD_WIDTH);

    seg.p.screen.scale = seg.p.screen.scale || 0;
    seg.p2.screen.scale = seg.p2.screen.scale || 0;

    x += dx;
    dx += seg.curve;

    if (seg.p.camera.z <= CAMERA_DEPTH || seg.p2.screen.y >= maxY) continue;

    projected.push({ seg, n });
    maxY = seg.p2.screen.y;
  }

  // Draw from back to front
  for (let i = projected.length - 1; i >= 0; i--) {
    const { seg, n } = projected[i];
    const p1 = seg.p.screen;
    const p2 = seg.p2.screen;
    const isDark = seg.color === 'dark';

    // Ground
    ctx.fillStyle = isDark ? COLORS.GROUND2 : COLORS.GROUND1;
    ctx.fillRect(0, p2.screen.y, W, p1.screen.y - p2.screen.y);

    // Rumble strips
    const rw1 = p1.screen.w * 1.15;
    const rw2 = p2.screen.w * 1.15;
    ctx.fillStyle = isDark ? COLORS.RUMBLE1 : COLORS.RUMBLE2;
    drawTrapezoid(p1.screen.x, p1.screen.y, rw1, p2.screen.x, p2.screen.y, rw2);

    // Road
    ctx.fillStyle = isDark ? COLORS.ROAD1 : COLORS.ROAD2;
    drawTrapezoid(p1.screen.x, p1.screen.y, p1.screen.w, p2.screen.x, p2.screen.y, p2.screen.w);

    // Lane markings
    if (!isDark) {
      ctx.fillStyle = COLORS.LANE;
      const lw1 = p1.screen.w / 30;
      const lw2 = p2.screen.w / 30;
      for (let lane = -1; lane <= 1; lane++) {
        if (lane === 0) continue;
        const lx1 = p1.screen.x + p1.screen.w * lane / LANES;
        const lx2 = p2.screen.x + p2.screen.w * lane / LANES;
        drawTrapezoid(lx1, p1.screen.y, lw1, lx2, p2.screen.y, lw2);
      }
    }

    // Start/finish line
    if (n < 3 && n > 0) {
      ctx.fillStyle = '#FFFFFF';
      drawTrapezoid(p1.screen.x, p1.screen.y, p1.screen.w * 0.9, p2.screen.x, p2.screen.y, p2.screen.w * 0.9);
    }

    // Draw sprites
    for (const sprite of seg.sprites) {
      drawSprite(sprite, p1, n);
    }

    // Draw traffic cars in this segment
    for (const car of trafficCars) {
      const carSegIdx = Math.floor(car.z / SEGMENT_LENGTH) % segments.length;
      if (carSegIdx === seg.index) {
        drawTrafficCar(car, p1);
      }
    }
  }

  // Draw cockpit (dashboard)
  drawCockpit();

  // Collision flash
  if (player._collisionFlash > 0) {
    ctx.fillStyle = `rgba(255, 100, 0, ${player._collisionFlash})`;
    ctx.fillRect(0, 0, W, H);
    player._collisionFlash -= dt * 3;
  }

  // Gear flash overlay
  if (player.gearFlash > 0) {
    ctx.fillStyle = `rgba(255, 200, 0, ${player.gearFlash * 0.3})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Lap notification
  if (player.lapFlash > 0) {
    const alpha = Math.min(1, player.lapFlash);
    ctx.fillStyle = `rgba(0, 0, 0, ${alpha * 0.5})`;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.font = `bold ${W * 0.08}px 'Courier New'`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`LAP ${player.lap}`, W / 2, H * 0.38);
    if (player.lapFlash > 1.5 && player.bestLap < Infinity) {
      ctx.font = `${W * 0.03}px 'Courier New'`;
      ctx.fillStyle = `rgba(255, 200, 0, ${alpha})`;
      ctx.fillText(`BEST: ${formatTime(player.bestLap)}`, W / 2, H * 0.46);
    }
  }

  // Speed lines effect (at high speed)
  drawSpeedLines();

  // Windshield glare
  drawWindshieldGlare();

  // Fog overlay
  drawFog();
}

function formatTime(t) {
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  const ms = Math.floor((t % 1) * 100);
  return `${m}:${s.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;
}

// --- Draw effects ---
function drawSpeedLines() {
  const speedRatio = player.speed / player.maxSpeed;
  if (speedRatio < 0.4) return;

  const alpha = (speedRatio - 0.4) * 0.6;
  const count = Math.floor((speedRatio - 0.4) * 40);

  ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
  ctx.lineWidth = 1;

  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + player.totalTime * 3;
    const cx = W / 2;
    const cy = H * 0.4;
    const innerR = H * 0.15;
    const outerR = H * 0.5 + speedRatio * H * 0.2;

    const x1 = cx + Math.cos(angle) * innerR;
    const y1 = cy + Math.sin(angle) * innerR * 0.4;
    const x2 = cx + Math.cos(angle) * outerR;
    const y2 = cy + Math.sin(angle) * outerR * 0.4;

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
}

function drawWindshieldGlare() {
  const speedRatio = player.speed / player.maxSpeed;
  if (speedRatio < 0.3) return;

  const glareAlpha = speedRatio * 0.08;
  const grad = ctx.createRadialGradient(
    W * 0.7, H * 0.15, 0,
    W * 0.7, H * 0.15, W * 0.4
  );
  grad.addColorStop(0, `rgba(255, 240, 200, ${glareAlpha})`);
  grad.addColorStop(1, 'rgba(255, 240, 200, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H * 0.5);

  if (speedRatio > 0.6) {
    const streakAlpha = (speedRatio - 0.6) * 0.15;
    ctx.strokeStyle = `rgba(200, 220, 255, ${streakAlpha})`;
    ctx.lineWidth = 1;
    for (let i = 0; i < 15; i++) {
      const sx = (i * W / 15 + player.totalTime * 300) % W;
      const sy = (i * 137 + player.totalTime * 500) % (H * 0.5);
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx - 3, sy + 30 + speedRatio * 20);
      ctx.stroke();
    }
  }
}

function drawFog() {
  const speedRatio = player.speed / player.maxSpeed;
  const fogAlpha = 0.15 + speedRatio * 0.1;

  const grad = ctx.createLinearGradient(0, H * 0.35, 0, H * 0.55);
  grad.addColorStop(0, `rgba(150, 170, 200, ${fogAlpha})`);
  grad.addColorStop(0.5, `rgba(150, 170, 200, ${fogAlpha * 0.5})`);
  grad.addColorStop(1, 'rgba(150, 170, 200, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, H * 0.35, W, H * 0.2);
}

function drawTrapezoid(x1, y1, w1, x2, y2, w2) {
  ctx.beginPath();
  ctx.moveTo(x1 - w1, y1);
  ctx.lineTo(x1 + w1, y1);
  ctx.lineTo(x2 + w2, y2);
  ctx.lineTo(x2 - w2, y2);
  ctx.closePath();
  ctx.fill();
}

function drawMountains() {
  // Far mountains
  ctx.fillStyle = '#0a1a3a';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.45);
  for (let i = 0; i <= W; i += 3) {
    const h = Math.sin(i * 0.003 + player.z * 0.00005) * 40 +
              Math.sin(i * 0.007 + 1) * 25 +
              Math.sin(i * 0.001) * 60;
    ctx.lineTo(i, H * 0.42 - h);
  }
  ctx.lineTo(W, H * 0.5);
  ctx.lineTo(0, H * 0.5);
  ctx.fill();

  // Near mountains
  ctx.fillStyle = '#0d2235';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.47);
  for (let i = 0; i <= W; i += 3) {
    const h = Math.sin(i * 0.005 + player.z * 0.0001) * 30 +
              Math.sin(i * 0.012 + 2) * 20;
    ctx.lineTo(i, H * 0.44 - h);
  }
  ctx.lineTo(W, H * 0.5);
  ctx.lineTo(0, H * 0.5);
  ctx.fill();
}

function drawSprite(sprite, p1, n) {
  const spriteX = p1.screen.x + p1.screen.w * sprite.offset;
  const spriteY = p1.screen.y;
  const spriteScale = p1.screen.scale / 3000;
  const spriteH = 300 * spriteScale;
  const spriteW = 150 * spriteScale;

  if (sprite.type === 'tree') {
    // Tree trunk
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(spriteX - spriteW * 0.1, spriteY - spriteH * 0.4, spriteW * 0.2, spriteH * 0.4);
    // Tree top
    ctx.fillStyle = '#0a4a0a';
    ctx.beginPath();
    ctx.moveTo(spriteX, spriteY - spriteH);
    ctx.lineTo(spriteX - spriteW * 0.5, spriteY - spriteH * 0.2);
    ctx.lineTo(spriteX + spriteW * 0.5, spriteY - spriteH * 0.2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(spriteX, spriteY - spriteH * 0.85);
    ctx.lineTo(spriteX - spriteW * 0.6, spriteY - spriteH * 0.15);
    ctx.lineTo(spriteX + spriteW * 0.6, spriteY - spriteH * 0.15);
    ctx.fill();
  } else if (sprite.type === 'rock') {
    ctx.fillStyle = '#5a5a5a';
    ctx.beginPath();
    ctx.moveTo(spriteX - spriteW * 0.4, spriteY);
    ctx.lineTo(spriteX - spriteW * 0.3, spriteY - spriteH * 0.3);
    ctx.lineTo(spriteX + spriteW * 0.1, spriteY - spriteH * 0.4);
    ctx.lineTo(spriteX + spriteW * 0.4, spriteY - spriteH * 0.15);
    ctx.lineTo(spriteX + spriteW * 0.3, spriteY);
    ctx.fill();
  }
}

function drawTrafficCar(car, p1) {
  const carX = p1.screen.x + p1.screen.w * car.offset;
  const carY = p1.screen.y;
  const carScale = p1.screen.scale / 4000;
  const carW = 200 * carScale;
  const carH = 120 * carScale;

  if (carW < 2) return;

  // Car body
  ctx.fillStyle = car.color;
  ctx.fillRect(carX - carW * 0.5, carY - carH * 0.7, carW, carH * 0.6);

  // Car top
  ctx.fillStyle = shadeColor(car.color, -30);
  ctx.fillRect(carX - carW * 0.35, carY - carH, carW * 0.7, carH * 0.35);

  // Windshield
  ctx.fillStyle = '#88bbdd';
  ctx.fillRect(carX - carW * 0.3, carY - carH * 0.85, carW * 0.6, carH * 0.2);

  // Wheels
  ctx.fillStyle = '#111';
  ctx.fillRect(carX - carW * 0.55, carY - carH * 0.15, carW * 0.15, carH * 0.2);
  ctx.fillRect(carX + carW * 0.4, carY - carH * 0.15, carW * 0.15, carH * 0.2);
}

function shadeColor(color, percent) {
  const num = parseInt(color.replace('#', ''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.max(0, Math.min(255, (num >> 16) + amt));
  const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
  const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
  return `rgb(${R},${G},${B})`;
}

function drawCockpit() {
  const isMobile = W < 768;
  const dashH = isMobile ? H * 0.18 : H * 0.22;
  const dashY = H - dashH;

  // Dashboard background
  const dashGrad = ctx.createLinearGradient(0, dashY, 0, H);
  dashGrad.addColorStop(0, '#1a1a1a');
  dashGrad.addColorStop(0.3, '#2a2a2a');
  dashGrad.addColorStop(1, '#111');
  ctx.fillStyle = dashGrad;

  // Dashboard shape
  ctx.beginPath();
  ctx.moveTo(0, dashY + 20);
  ctx.quadraticCurveTo(W * 0.5, dashY - 10, W, dashY + 20);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();

  // Dashboard edge highlight
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, dashY + 20);
  ctx.quadraticCurveTo(W * 0.5, dashY - 10, W, dashY + 20);
  ctx.stroke();

  // Steering wheel
  drawSteeringWheel();

  // Speedometer
  drawSpeedometer();

  // Tachometer
  drawTachometer();

  // Gear indicator
  drawGearIndicator();

  // Side mirrors
  drawSideMirrors();
}

function drawSteeringWheel() {
  const isMobile = W < 768;
  const cx = W * 0.5;
  const cy = isMobile ? H * 0.80 : H * 0.82;
  const r = isMobile ? Math.min(W, H) * 0.07 : Math.min(W, H) * 0.1;
  const steerOffset = player.steerAngle * r * 0.6;

  // Wheel shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(cx + 3, cy + 3, r, r * 0.9, 0, 0, Math.PI * 2);
  ctx.fill();

  // Wheel outer
  ctx.strokeStyle = '#222';
  ctx.lineWidth = r * 0.12;
  ctx.beginPath();
  ctx.ellipse(cx + steerOffset, cy, r, r * 0.9, 0, 0, Math.PI * 2);
  ctx.stroke();

  // Wheel inner ring
  ctx.strokeStyle = '#333';
  ctx.lineWidth = r * 0.04;
  ctx.beginPath();
  ctx.ellipse(cx + steerOffset, cy, r * 0.65, r * 0.58, 0, 0, Math.PI * 2);
  ctx.stroke();

  // Wheel spokes
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = r * 0.06;
  for (let i = 0; i < 3; i++) {
    const angle = (i / 3) * Math.PI * 2 + Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx + steerOffset, cy);
    ctx.lineTo(cx + steerOffset + Math.cos(angle) * r * 0.65, cy + Math.sin(angle) * r * 0.58);
    ctx.stroke();
  }

  // Center horn
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.ellipse(cx + steerOffset, cy, r * 0.18, r * 0.16, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Logo
  ctx.fillStyle = '#666';
  ctx.font = `${r * 0.12}px 'Courier New'`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('V', cx + steerOffset, cy);
}

function drawSpeedometer() {
  const isMobile = W < 768;
  const cx = isMobile ? W * 0.72 : W * 0.78;
  const cy = isMobile ? H * 0.80 : H * 0.82;
  const r = isMobile ? Math.min(W, H) * 0.09 : Math.min(W, H) * 0.12;
  const kmh = Math.round(player.speed / player.maxSpeed * 280);

  // Gauge background
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  // Gauge border
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  // Inner bezel
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, r - 5, 0, Math.PI * 2);
  ctx.stroke();

  // Scale marks
  const startAngle = Math.PI * 0.75;
  const endAngle = Math.PI * 2.25;
  for (let i = 0; i <= 14; i++) {
    const angle = startAngle + (endAngle - startAngle) * (i / 14);
    const isMajor = i % 2 === 0;
    const innerR = isMajor ? r - 25 : r - 15;
    const outerR = r - 8;

    ctx.strokeStyle = i >= 10 ? '#ff4400' : '#aaa';
    ctx.lineWidth = isMajor ? 2 : 1;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(angle) * innerR, cy + Math.sin(angle) * innerR);
    ctx.lineTo(cx + Math.cos(angle) * outerR, cy + Math.sin(angle) * outerR);
    ctx.stroke();

    // Numbers
    if (isMajor) {
      const numR = r - 38;
      ctx.fillStyle = '#aaa';
      ctx.font = `${r * 0.13}px 'Courier New'`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(i * 20, cx + Math.cos(angle) * numR, cy + Math.sin(angle) * numR);
    }
  }

  // Red zone
  ctx.strokeStyle = 'rgba(255, 0, 0, 0.3)';
  ctx.lineWidth = r * 0.05;
  ctx.beginPath();
  const redStart = Math.PI * 0.75 + (Math.PI * 1.5) * (10 / 14);
  ctx.arc(cx, cy, r - 5, redStart, endAngle);
  ctx.stroke();

  // Needle
  const needleAngle = startAngle + (endAngle - startAngle) * (kmh / 280);
  const needleLen = r * 0.7;

  // Needle shadow
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(needleAngle + 0.05) * needleLen, cy + Math.sin(needleAngle + 0.05) * needleLen);
  ctx.stroke();

  // Needle
  ctx.strokeStyle = '#ff4400';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(cx - Math.cos(needleAngle) * r * 0.15, cy - Math.sin(needleAngle) * r * 0.15);
  ctx.lineTo(cx + Math.cos(needleAngle) * needleLen, cy + Math.sin(needleAngle) * needleLen);
  ctx.stroke();

  // Center cap
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(cx, cy, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#555';
  ctx.beginPath();
  ctx.arc(cx, cy, 5, 0, Math.PI * 2);
  ctx.fill();

  // Digital speed
  ctx.fillStyle = '#ff4400';
  ctx.font = `bold ${r * 0.25}px 'Courier New'`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(kmh, cx, cy + r * 0.35);
  ctx.fillStyle = '#666';
  ctx.font = `${r * 0.1}px 'Courier New'`;
  ctx.fillText('km/h', cx, cy + r * 0.55);
}

function drawTachometer() {
  const isMobile = W < 768;
  const cx = isMobile ? W * 0.28 : W * 0.22;
  const cy = isMobile ? H * 0.80 : H * 0.82;
  const r = isMobile ? Math.min(W, H) * 0.09 : Math.min(W, H) * 0.12;
  const rpm = player.rpm;

  // Gauge background
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  // Gauge border
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  // Scale marks
  const startAngle = Math.PI * 0.75;
  const endAngle = Math.PI * 2.25;
  for (let i = 0; i <= 8; i++) {
    const angle = startAngle + (endAngle - startAngle) * (i / 8);
    const isMajor = i % 2 === 0;
    const innerR = isMajor ? r - 25 : r - 15;
    const outerR = r - 8;

    ctx.strokeStyle = i >= 6 ? '#ff0000' : '#aaa';
    ctx.lineWidth = isMajor ? 2 : 1;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(angle) * innerR, cy + Math.sin(angle) * innerR);
    ctx.lineTo(cx + Math.cos(angle) * outerR, cy + Math.sin(angle) * outerR);
    ctx.stroke();

    if (isMajor) {
      const numR = r - 38;
      ctx.fillStyle = '#aaa';
      ctx.font = `${r * 0.13}px 'Courier New'`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(i, cx + Math.cos(angle) * numR, cy + Math.sin(angle) * numR);
    }
  }

  // Red zone (6500+ RPM)
  ctx.strokeStyle = 'rgba(255, 0, 0, 0.3)';
  ctx.lineWidth = r * 0.05;
  ctx.beginPath();
  const redStart = Math.PI * 0.75 + (Math.PI * 1.5) * (6.5 / 8);
  ctx.arc(cx, cy, r - 5, redStart, endAngle);
  ctx.stroke();

  // Needle
  const needleAngle = startAngle + (endAngle - startAngle) * (rpm / 8500);
  const needleLen = r * 0.7;

  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(needleAngle + 0.05) * needleLen, cy + Math.sin(needleAngle + 0.05) * needleLen);
  ctx.stroke();

  ctx.strokeStyle = '#ffcc00';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(cx - Math.cos(needleAngle) * r * 0.15, cy - Math.sin(needleAngle) * r * 0.15);
  ctx.lineTo(cx + Math.cos(needleAngle) * needleLen, cy + Math.sin(needleAngle) * needleLen);
  ctx.stroke();

  // Center cap
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(cx, cy, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#555';
  ctx.beginPath();
  ctx.arc(cx, cy, 5, 0, Math.PI * 2);
  ctx.fill();

  // Digital RPM
  ctx.fillStyle = '#ffcc00';
  ctx.font = `bold ${r * 0.2}px 'Courier New'`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(Math.round(rpm), cx, cy + r * 0.35);
  ctx.fillStyle = '#666';
  ctx.font = `${r * 0.09}px 'Courier New'`;
  ctx.fillText('RPM x1000', cx, cy + r * 0.55);
}

function drawGearIndicator() {
  const isMobile = W < 768;
  const cx = W * 0.5;
  const cy = isMobile ? H * 0.70 : H * 0.72;
  const w = isMobile ? 45 : 60;
  const h = isMobile ? 30 : 40;

  // Background
  ctx.fillStyle = '#000';
  ctx.fillRect(cx - w/2, cy - h/2, w, h);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.strokeRect(cx - w/2, cy - h/2, cx + w/2, cy + h/2);

  // Gear number
  ctx.fillStyle = '#ff4400';
  ctx.font = `bold ${h * 0.6}px 'Courier New'`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(player.gear, cx, cy);
}

function drawSideMirrors() {
  const isMobile = W < 768;
  const mirrorW = isMobile ? W * 0.08 : W * 0.06;
  const mirrorH = isMobile ? H * 0.10 : H * 0.08;

  // Left mirror
  drawMirror(isMobile ? W * 0.02 : W * 0.03, H * 0.60, mirrorW, mirrorH, -1);
  // Right mirror
  drawMirror(W - isMobile ? W * 0.02 : W * 0.03 - mirrorW, H * 0.60, mirrorW, mirrorH, 1);
}

function drawMirror(x, y, w, h, side) {
  // Mirror housing
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.ellipse(x + w/2, y + h/2, w/2 + 5, h/2 + 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Mirror glass
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
  ctx.clip();

  // Sky
  const mirrorGrad = ctx.createLinearGradient(x, y, x, y + h);
  mirrorGrad.addColorStop(0, '#1a2a5a');
  mirrorGrad.addColorStop(1, '#2a4a2a');
  ctx.fillStyle = mirrorGrad;
  ctx.fillRect(x, y, w, h);

  // Road reflection (moving)
  const offset = (player.z * 0.01 * side) % 20;
  ctx.fillStyle = '#444';
  ctx.fillRect(x, y + h * 0.6, w, h * 0.4);

  // Lane line
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + w/2 - 1, y + h * 0.6, 2, h * 0.4);

  ctx.restore();

  // Mirror border
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(x + w/2, y + h/2, w/2 + 3, h/2 + 3, 0, 0, Math.PI * 2);
  ctx.stroke();
}

// --- Reset ---
function resetGame() {
  buildTrack();
  addSprites();
  initTraffic();
  player.x = 0;
  player.z = 0;
  player.speed = 0;
  player.steerAngle = 0;
  player.lap = 0;
  player.lapTime = 0;
  player.totalTime = 0;
  player.distance = 0;
  player.bestLap = Infinity;
}

// --- Game loop ---
function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  if (gameRunning) {
    update(dt);
    updateAudio();
    render();
  }

  requestAnimationFrame(gameLoop);
}

// --- Start ---
const startBtn = document.getElementById('startBtn');
function startGame() {
  try {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('touch-controls').classList.add('hidden');
    initAudio();
    resetGame();
    gameRunning = true;
    lastTime = 0;
    requestAnimationFrame(gameLoop);
  } catch (e) {
    console.error('Game start error:', e);
    alert('エラーが発生しました: ' + e.message);
  }
}
startBtn.addEventListener('click', startGame);
startBtn.addEventListener('touchend', (e) => { e.preventDefault(); startGame(); });

// --- Download ---
document.getElementById('downloadBtn').addEventListener('click', () => {
  const a = document.createElement('a');
